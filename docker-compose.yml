# ClipCrow, CPU only. Pulls the image built by .github/workflows/image.yml from GitHub's container registry.
# Coolify: new resource > Docker Compose > this file; add a registry credential for ghcr.io (a token with read:packages)
# because the package is private; set the variables below in the Coolify UI. See docs/deploy.md.
services:
  # PostgreSQL for the accounts (and, once you switch them on, the job and brand records: docs/postgres-migration.md). It starts beside ClipCrow; nothing to configure.
  # Coolify creates the password (SERVICE_PASSWORD_POSTGRES); elsewhere set POSTGRES_PASSWORD (letters and digits only: it sits inside the address below).
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=clipcrow
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (or let Coolify create SERVICE_PASSWORD_POSTGRES)}}
      - POSTGRES_DB=clipcrow
    volumes:
      - clipcrow-pg:/var/lib/postgresql/data       # the accounts, minutes and payments: back this up (pg_dump daily, and keep a copy off this machine)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipcrow -d clipcrow"]
      interval: 10s
      timeout: 5s
      retries: 10
  clipcrow:
    image: ghcr.io/halleshubham/clipcrow:${CLIPCROW_TAG:-cpu}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: "2gb"                 # headless Chrome crashes on Docker's default 64 MB /dev/shm
    stop_grace_period: 90s          # must stay above DRAIN_TIMEOUT_SECONDS (45) + the server's own 20 s shutdown wait
    environment:
      # Coolify: gives the service a domain and routes it (a "magic" variable; Coolify fills it in)
      - SERVICE_FQDN_CLIPCROW_8000
      # --- who may use it: set ONE of these. Without either the server refuses to start on a public address.
      - CLIPCROW_ACCOUNTS=${CLIPCROW_ACCOUNTS:-}            # 1 = sign-up and per-user jobs (see CLIPCROW_SIGNUP, CLIPCROW_PLANS)
      - CLIPCROW_SIGNUP=${CLIPCROW_SIGNUP:-}                # 0 = close registration
      - CLIPCROW_PLANS=${CLIPCROW_PLANS:-}                  # e.g. /data/plans.json (plans, credit packs; no prices live in the code)
      # --- the planner
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLIPCROW_MODEL=${CLIPCROW_MODEL:-}
      - CLIPCROW_MODEL_SCORE=${CLIPCROW_MODEL_SCORE:-}
      - CLIPCROW_MODEL_REFINE=${CLIPCROW_MODEL_REFINE:-}
      - CLIPCROW_MODEL_VERIFY=${CLIPCROW_MODEL_VERIFY:-}
      - CLIPCROW_MODEL_JUDGE=${CLIPCROW_MODEL_JUDGE:-}
      - CLIPCROW_INDIC_MODEL=${CLIPCROW_INDIC_MODEL:-}      # e.g. large-v3 for Marathi/Hindi
      - CLIPCROW_WHISPER_DEVICE=${CLIPCROW_WHISPER_DEVICE:-}  # empty = auto: the GPU when one is visible, else the CPU
      - CLIPCROW_ASR=${CLIPCROW_ASR:-}                      # sravaani = SraVaani first for Marathi/Hindi (needs HF_TOKEN of an account with access), Whisper as the fallback
      - HF_TOKEN=${HF_TOKEN:-}                              # optional: faster, rate-limit-free model downloads from Hugging Face
      # --- object storage (Cloudflare R2 or any S3-compatible store); leave empty to keep everything on the /data volume
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PREFIX=${R2_PREFIX:-clipcrow}
      - CLIPCROW_R2_BACKUP_SOURCE=${CLIPCROW_R2_BACKUP_SOURCE:-}
      - CLIPCROW_R2_REDIRECT=${CLIPCROW_R2_REDIRECT:-}
      - CLIPCROW_LOCAL_CLIP_DAYS=${CLIPCROW_LOCAL_CLIP_DAYS:-}      # with R2: days a clip file stays here after its copy is in the bucket (empty = ~1 hour, 0 = at once, off = for ever)
      - CLIPCROW_DIRECT_UPLOAD=${CLIPCROW_DIRECT_UPLOAD:-}        # 0 = send uploads through the server instead of straight to R2
      - CLIPCROW_UPLOAD_PART_MB=${CLIPCROW_UPLOAD_PART_MB:-}      # part size for direct uploads (default 64; smaller retries faster on a bad connection)
      # --- retention without accounts (0 = keep for ever)
      - CLIPCROW_RETENTION_DAYS=${CLIPCROW_RETENTION_DAYS:-}
      - CLIPCROW_SOURCE_DAYS=${CLIPCROW_SOURCE_DAYS:-}
      # --- optional integrations
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - SOCIOBIRD_API_URL=${SOCIOBIRD_API_URL:-}
      - SOCIOBIRD_API_KEY=${SOCIOBIRD_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # --- a GPU worker on another machine (your own PC) does the speech recognition: see docs/deploy.md. Empty = off.
      - CLIPCROW_WORKER_TOKEN=${CLIPCROW_WORKER_TOKEN:-}
      - CLIPCROW_WORKER_PICKUP_SECONDS=${CLIPCROW_WORKER_PICKUP_SECONDS:-120}
      - CLIPCROW_WORKER_MAX_UPLOAD_MB=${CLIPCROW_WORKER_MAX_UPLOAD_MB:-300}      # the biggest clip a worker may send back
      - CLIPCROW_WORKER_MAX_CLIP_SECONDS=${CLIPCROW_WORKER_MAX_CLIP_SECONDS:-60}      # longer clips need a worker that sends the MP4 to the bucket (no proxy cap); otherwise they render on the server; 0 = no limit
      # --- accounts database: empty = the PostgreSQL service in this file; a postgresql:// address = another PostgreSQL (docs/deploy.md). It holds a password: keep it a secret variable.
      - DATABASE_URL=${DATABASE_URL:-}
      # the PostgreSQL service above. Used unless DATABASE_URL names another one; if the SQLite file still holds your people it keeps being used (with a warning) until you run
      # clipcrow migrate-db, so adding this service to a running installation cannot lose anyone.
      - CLIPCROW_BUNDLED_DB=postgresql://clipcrow:${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD}}@postgres:5432/clipcrow
      - CLIPCROW_AUTO_MIGRATE_DB=${CLIPCROW_AUTO_MIGRATE_DB:-}   # 1 = on start, copy the people from the SQLite file into the bundled PostgreSQL (safe to leave on; remove it afterwards)
      - CLIPCROW_ALLOW_EMPTY_DB=${CLIPCROW_ALLOW_EMPTY_DB:-}   # 1 = start on an empty DATABASE_URL although the SQLite file has people (a deliberate fresh start)
      - CLIPCROW_DB_POOL=${CLIPCROW_DB_POOL:-}              # PostgreSQL connections kept ready (default 10)
      - CLIPCROW_SECRET_KEY=${CLIPCROW_SECRET_KEY:-}        # keys sign-in codes and seals stored credentials; empty = a random one in /data/clipcrow.secret (back it up)
      # --- email (sign-in is by emailed code): Resend by default, or SMTP; see docs/deploy.md
      - CLIPCROW_EMAIL=${CLIPCROW_EMAIL:-}
      - CLIPCROW_EMAIL_FALLBACK=${CLIPCROW_EMAIL_FALLBACK:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-}
      - CLIPCROW_PUBLIC_URL=${CLIPCROW_PUBLIC_URL:-}        # https://clipcrow.example (links in mail are built from it)
      # --- running it as a service (most of these can also be changed live on the Operator page)
      - CLIPCROW_ADMINS=${CLIPCROW_ADMINS:-}
      - CLIPCROW_ALERT_EMAIL=${CLIPCROW_ALERT_EMAIL:-}
      - CLIPCROW_SAMPLE_DIR=${CLIPCROW_SAMPLE_DIR:-}
      - CLIPCROW_PRICE_PER_MINUTE=${CLIPCROW_PRICE_PER_MINUTE:-}
      - CLIPCROW_MIN_JOB_MINUTES=${CLIPCROW_MIN_JOB_MINUTES:-}
      - CLIPCROW_MARGIN_PERCENT=${CLIPCROW_MARGIN_PERCENT:-}
      - CLIPCROW_MAX_ACTIVE_JOBS=${CLIPCROW_MAX_ACTIVE_JOBS:-}
      - CLIPCROW_MAX_JOBS_PER_DAY=${CLIPCROW_MAX_JOBS_PER_DAY:-}
      - CLIPCROW_MAX_JOB_MINUTES=${CLIPCROW_MAX_JOB_MINUTES:-}
      - CLIPCROW_MAX_SIGNUPS_PER_DAY=${CLIPCROW_MAX_SIGNUPS_PER_DAY:-}
      - SOCIOBIRD_OAUTH_CLIENT_ID=${SOCIOBIRD_OAUTH_CLIENT_ID:-}
      - SOCIOBIRD_OAUTH_CLIENT_SECRET=${SOCIOBIRD_OAUTH_CLIENT_SECRET:-}
      # --- shutdown: how long a deploy waits for the running job before putting it back in the queue
      - DRAIN_TIMEOUT_SECONDS=${DRAIN_TIMEOUT_SECONDS:-45}
    volumes:
      - clipcrow-data:/data         # jobs, uploads, clipcrow.db (and plans.json): back this up
      - clipcrow-models:/models     # Whisper and matte model caches: safe to lose, slow to refill
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  clipcrow-pg:
  clipcrow-data:
  clipcrow-models:
