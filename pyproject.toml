[project]
name = "clipcrow"
version = "0.1.0"
description = "EDL-driven short-video renderer: EDL JSON in, HyperFrames project and MP4 out."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[server]>=5"]      # moto: an S3-compatible server for the storage tests
llm = ["anthropic>=1.0"]
examples = ["pillow", "numpy"]
# av < 19: PyAV 19 dropped av.open(metadata_errors=...), which faster-whisper (1.2.1, the newest) still passes: every transcription
# fails with "open() got an unexpected keyword argument 'metadata_errors'". Lift the bound when faster-whisper stops passing it.
asr = ["faster-whisper>=1.1", "av>=12.3,<19"]
vision = ["opencv-python-headless>=4.8,<5", "numpy"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
storage = ["boto3>=1.36"]              # Cloudflare R2 / S3 (boto3 >= 1.36 so the checksum setting R2 needs exists)
assets = ["playwright>=1.40"]          # page screenshots for explainer mode (then: playwright install chromium)

[project.scripts]
clipcrow = "clipcrow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipcrow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["render: needs Node 22, FFmpeg, Chrome and the HyperFrames CLI (set CLIPCROW_RENDER_TESTS=1)"]

[tool.setuptools.package-data]
"clipcrow.service" = ["static/*"]
