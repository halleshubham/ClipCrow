[project]
name = "reelcore"
version = "0.1.0"
description = "EDL-driven short-video renderer: EDL JSON in, HyperFrames project and MP4 out."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reelcore = "reelcore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reelcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs Node 22, FFmpeg, Chrome and the HyperFrames CLI (set REELCORE_RENDER_TESTS=1)"]
