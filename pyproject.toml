[project]
name = "clipcrow"
version = "0.1.0"
description = "EDL-driven short-video renderer: EDL JSON in, HyperFrames project and MP4 out."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=1.0"]
examples = ["pillow", "numpy"]

[project.scripts]
clipcrow = "clipcrow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipcrow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs Node 22, FFmpeg, Chrome and the HyperFrames CLI (set CLIPCROW_RENDER_TESTS=1)"]
