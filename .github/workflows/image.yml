name: Image

# Builds the ClipCrow image, smoke-tests it (a real render inside the image), and pushes it to ghcr.io on main and on
# version tags. Two variants: "latest" (CUDA libraries, for an NVIDIA GPU, also runs on CPU) and "cpu" (smaller).
# The package stays PRIVATE (GSAP and a GPL FFmpeg build are inside): Coolify pulls with a token that has read:packages.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [Dockerfile, .dockerignore, docker/**, clipcrow/**, scripts/**, pyproject.toml, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, docker/**, scripts/**, pyproject.toml, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [gpu, cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Free disk space (the CUDA image is large)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet 2>/dev/null || true
          df -h / | tail -1

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant == 'gpu' && github.ref == 'refs/heads/main' }}
            type=raw,value=cpu,enable=${{ matrix.variant == 'cpu' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,suffix=${{ matrix.variant == 'cpu' && '-cpu' || '' }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant == 'cpu' && '-cpu' || '' }}

      - name: Build (kept locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: clipcrow-smoke:${{ matrix.variant }}
          build-args: |
            WITH_CUDA=${{ matrix.variant == 'gpu' && '1' || '0' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        run: scripts/smoke_image.sh clipcrow-smoke:${{ matrix.variant }} ${{ matrix.variant }}

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_CUDA=${{ matrix.variant == 'gpu' && '1' || '0' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
