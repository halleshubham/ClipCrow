name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Devanagari font tests need Noto; without it they skip, so install it.
      - name: System packages (fonts, ffmpeg)
        timeout-minutes: 8
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends fonts-noto-core ffmpeg
      - run: pip install -e '.[dev,llm,vision,service]'
      - run: pytest -q

  render:
    timeout-minutes: 30
    # One real render through the pinned HyperFrames CLI: Node, FFmpeg and Chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # FFmpeg is not preinstalled on every runner image.
      - name: System packages (fonts, ffmpeg)
        timeout-minutes: 8
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends fonts-noto-core ffmpeg
      - run: pip install -e '.[dev,llm,examples,vision,service]'
      - run: scripts/fetch_gsap.sh
      - run: python examples/gen_assets.py
      - run: pytest -q -m render
        env:
          CLIPCROW_RENDER_TESTS: "1"
