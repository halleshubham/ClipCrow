name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    # A real PostgreSQL for the accounts tests (the same tests also run on SQLite in the full pass).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: clipcrow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Devanagari font tests need Noto; without it they skip, so install it.
      # No apt: the runners' Ubuntu mirrors are not always reachable. GitHub and npm are.
      - name: ffmpeg and Noto fonts
        timeout-minutes: 8
        run: scripts/ci_system_deps.sh
      - run: pip install -e '.[dev,llm,vision,service,storage,asr]'
      - run: pytest -q
      # the tests that touch accounts, money, settings, posting and the database layer, again with every Accounts in PostgreSQL
      - run: pytest -q tests/test_accounts.py tests/test_billing.py tests/test_payg.py tests/test_ops.py tests/test_settings.py tests/test_sample.py tests/test_sociobird_user.py tests/test_publish.py tests/test_db.py
        env:
          CLIPCROW_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/clipcrow_test

  render:
    timeout-minutes: 30
    # One real render through the pinned HyperFrames CLI: Node, FFmpeg and Chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # FFmpeg is not preinstalled on every runner image.
      # No apt: the runners' Ubuntu mirrors are not always reachable. GitHub and npm are.
      - name: ffmpeg and Noto fonts
        timeout-minutes: 8
        run: scripts/ci_system_deps.sh
      - run: pip install -e '.[dev,llm,examples,vision,service,storage,asr]'
      - run: scripts/fetch_gsap.sh
      - run: python examples/gen_assets.py
      - run: pytest -q -m render
        env:
          CLIPCROW_RENDER_TESTS: "1"
