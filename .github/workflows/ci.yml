name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Devanagari font tests need Noto; without it they skip, so install it.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: pip install -e '.[dev,llm]'
      - run: pytest -q

  render:
    # One real render through the pinned HyperFrames CLI: Node, FFmpeg and Chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: pip install -e '.[dev,llm,examples]'
      - run: scripts/fetch_gsap.sh
      - run: python examples/gen_assets.py
      - run: pytest -q -m render
        env:
          CLIPCROW_RENDER_TESTS: "1"
