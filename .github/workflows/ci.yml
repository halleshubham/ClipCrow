name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Devanagari font tests need Noto; without it they skip, so install it.
      # No apt: the runners' Ubuntu mirrors are not always reachable. GitHub and npm are.
      - name: ffmpeg and Noto fonts
        timeout-minutes: 8
        run: scripts/ci_system_deps.sh
      - run: pip install -e '.[dev,llm,vision,service]'
      - run: pytest -q

  render:
    timeout-minutes: 30
    # One real render through the pinned HyperFrames CLI: Node, FFmpeg and Chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # FFmpeg is not preinstalled on every runner image.
      # No apt: the runners' Ubuntu mirrors are not always reachable. GitHub and npm are.
      - name: ffmpeg and Noto fonts
        timeout-minutes: 8
        run: scripts/ci_system_deps.sh
      - run: pip install -e '.[dev,llm,examples,vision,service]'
      - run: scripts/fetch_gsap.sh
      - run: python examples/gen_assets.py
      - run: pytest -q -m render
        env:
          CLIPCROW_RENDER_TESTS: "1"
